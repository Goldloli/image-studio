[package]
name = "image-studio-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "image-studio-desktop"

# Test-only: a supervisor that ignores cancellation so the forced-reap path stays covered.
[[bin]]
name = "stub-supervisor"
path = "src/bin/stub_supervisor.rs"
test = false
bench = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
studio-core.workspace = true
worker-protocol.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
fs2.workspace = true
rusqlite.workspace = true
png.workspace = true
image.workspace = true
reqwest.workspace = true
semver.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true
rfd = "=0.18.0"
inference-supervisor = { path = "../../tools/inference-supervisor" }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
