[package]
name = "image-studio-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "image-studio-desktop"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
studio-core.workspace = true
worker-protocol.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
uuid.workspace = true
fs2.workspace = true
rusqlite.workspace = true
png.workspace = true
reqwest.workspace = true
flate2.workspace = true
tar.workspace = true
rfd = "=0.17.2"
inference-supervisor = { path = "../../tools/inference-supervisor" }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
