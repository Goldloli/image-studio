name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.17.0

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.12.0

      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # tauri::generate_context! embeds ../frontend/dist at compile time and
      # panics when it is missing, so build the frontend before any cargo step
      # on a clean checkout.
      - name: frontend build (required by tauri generate_context)
        working-directory: apps/frontend
        run: npm run build

      - name: Build Windows sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked -p inference-supervisor -p diagnostic-worker -p realesrgan-worker
          $target = "x86_64-pc-windows-msvc"
          $destination = "apps/desktop/binaries"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          foreach ($name in @("inference-supervisor", "diagnostic-worker", "realesrgan-worker")) {
            Copy-Item -Force -LiteralPath "target/debug/$name.exe" -Destination "$destination/$name-$target.exe"
          }

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: workspace tests
        run: cargo test --workspace --locked

      - name: frontend tests
        working-directory: apps/frontend
        run: npm test

      - name: frontend typecheck
        working-directory: apps/frontend
        run: npm run check

      - name: OpenSpec strict validation
        run: openspec validate --all --strict

      - name: Tool versions
        shell: bash
        run: |
          rustc -V
          cargo -V
          node -v
          npm -v
          openspec --version
