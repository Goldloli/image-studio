name: build-artifacts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Build internal installer
        shell: pwsh
        run: ./scripts/build-windows-internal.ps1 -SkipQualityGates

      - name: Checksums and package evidence
        shell: pwsh
        run: |
          $version = (node -p "require('./apps/desktop/tauri.conf.json').version").Trim()
          $installerName = "Image Studio_${version}_x64-setup.exe"
          $installer = Join-Path "target/release/bundle/nsis" $installerName
          if (-not (Test-Path -LiteralPath $installer)) { throw "installer missing: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLower()
          $stage = Join-Path "target" "ci-artifacts/windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $installer -Destination (Join-Path $stage $installerName)
          # LF line ending so the Ubuntu release job can run `sha256sum -c`.
          [System.IO.File]::WriteAllText((Join-Path $stage "SHA256SUMS-windows.txt"), "$hash  $installerName`n")
          Copy-Item -LiteralPath "verification/windows-installer/internal-package.json" -Destination (Join-Path $stage "internal-package.json")
          Get-ChildItem -LiteralPath $stage | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 14
          path: target/ci-artifacts/windows/*

  macos:
    name: macOS app
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # tauri::generate_context! embeds ../frontend/dist at compile time.
      - name: frontend build (required by tauri generate_context)
        working-directory: apps/frontend
        run: npm run build

      - name: Build release workspace
        run: cargo build --release --locked --workspace

      - name: Package unsigned app
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/desktop/tauri.conf.json').version")
          python3 scripts/prepare-macos-dev-app.py --profile release --output "target/release/Image Studio.app"
          ARCHIVE_NAME="Image-Studio-${VERSION}-macos-arm64.zip"
          ARCHIVE="target/release/${ARCHIVE_NAME}"
          ditto -c -k --keepParent "target/release/Image Studio.app" "$ARCHIVE"
          STAGE="target/ci-artifacts/macos"
          mkdir -p "$STAGE"
          cp "$ARCHIVE" "$STAGE/$ARCHIVE_NAME"
          shasum -a 256 "$STAGE/$ARCHIVE_NAME" | sed "s#${STAGE}/##" > "$STAGE/SHA256SUMS-macos.txt"
          ls -l "$STAGE"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          if-no-files-found: error
          retention-days: 14
          path: target/ci-artifacts/macos/*
