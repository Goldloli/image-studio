name: build-artifacts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.17.0

      - name: Build internal installer
        shell: pwsh
        run: ./scripts/build-windows-internal.ps1 -SkipQualityGates

      - name: Checksums and package evidence
        shell: pwsh
        run: |
          $version = (node -p "require('./apps/desktop/tauri.conf.json').version").Trim()
          $builtInstallerName = "Image Studio_${version}_x64-setup.exe"
          $installerName = $builtInstallerName.Replace(" ", ".")
          $installer = Join-Path "target/release/bundle/nsis" $builtInstallerName
          if (-not (Test-Path -LiteralPath $installer)) { throw "installer missing: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLower()
          $bytes = (Get-Item -LiteralPath $installer).Length
          $evidencePath = "verification/windows-installer/internal-package.json"
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.installer_sha256 -ne $hash) { throw "installer digest does not match internal-package.json" }
          if ($evidence.installer_bytes -ne $bytes) { throw "installer byte count does not match internal-package.json" }
          if ($evidence.target -ne "x86_64-pc-windows-msvc") { throw "unexpected Windows target: $($evidence.target)" }
          $stage = Join-Path "target" "ci-artifacts/windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $installer -Destination (Join-Path $stage $installerName)
          # LF line ending so the Ubuntu release job can run `sha256sum -c`.
          [System.IO.File]::WriteAllText((Join-Path $stage "SHA256SUMS-windows.txt"), "$hash  $installerName`n")
          Copy-Item -LiteralPath $evidencePath -Destination (Join-Path $stage "internal-package.json")
          Get-ChildItem -LiteralPath $stage | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 14
          path: target/ci-artifacts/windows/*

  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify macOS runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.17.0

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # tauri::generate_context! embeds ../frontend/dist at compile time.
      - name: frontend build (required by tauri generate_context)
        working-directory: apps/frontend
        run: npm run build

      - name: Build release workspace
        run: cargo build --release --locked --workspace

      - name: Package unsigned app
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          VERSION=$(node -p "require('./apps/desktop/tauri.conf.json').version")
          python3 scripts/prepare-macos-dev-app.py --profile release --output "target/release/Image Studio.app"
          APP="target/release/Image Studio.app"
          for binary in image-studio-desktop diagnostic-worker inference-supervisor realesrgan-worker; do
            file "$APP/Contents/MacOS/$binary" | grep -q 'arm64'
          done
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "io.github.goldloli.image-studio"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          test -f "$APP/Contents/Resources/LICENSE"
          test -f "$APP/Contents/Resources/THIRD_PARTY_NOTICES.md"
          ARCHIVE_NAME="Image-Studio-${VERSION}-macos-arm64.zip"
          ARCHIVE="target/release/${ARCHIVE_NAME}"
          ditto -c -k --norsrc --noextattr --keepParent "$APP" "$ARCHIVE"
          STAGE="target/ci-artifacts/macos"
          mkdir -p "$STAGE"
          cp "$ARCHIVE" "$STAGE/$ARCHIVE_NAME"
          shasum -a 256 "$STAGE/$ARCHIVE_NAME" | sed "s#${STAGE}/##" > "$STAGE/SHA256SUMS-macos.txt"
          ls -l "$STAGE"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          if-no-files-found: error
          retention-days: 14
          path: target/ci-artifacts/macos/*
